<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Current WeatherApp</title>
    <title>WikiBot</title>
    {% csrf_token %}
    <script>
        var csrf = "{{ csrf_token }}"
    </script>
    {% load static %}
    <link rel="icon" type="image/x-icon" href={% static 'currentweather/favicon.ico' %}>
    <link rel="stylesheet" href="{% static 'currentweather/css/styles.css' %}">
    <script src="{% static 'currentweather/js/scripts.js' %}"></script>
</head>

<section class="top-banner">
    <div class="container">
        <h1 class="heading">Current Weather App (Tutorial)</h1>
        <form>
            <input type="text" placeholder="Search for a city" autofocus>
            <button type="submit">SUBMIT</button>
            <span class="msg"></span>
        </form>
    </div>
</section>
<section class="ajax-section">
    <div class="container">
        <ul class="cities"></ul>
    </div>
</section>
